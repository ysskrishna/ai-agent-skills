# Run validate-skills.sh: spec checks per skill plus repo checks (descriptions, examples, evals, README / marketplace / slug map sync).
name: Validate skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "evals/**"
      - "scripts/**"
      - "README.md"
      - ".claude-plugin/**"
      - "validate-skills.sh"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "evals/**"
      - "scripts/**"
      - "README.md"
      - ".claude-plugin/**"
      - "validate-skills.sh"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skills and repository
        run: bash validate-skills.sh
