# Run validate-skills.sh: spec checks per skill plus repo checks (descriptions, examples, evals, README / marketplace / slug map sync).
name: Validate skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "evals/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"
      - "plugin.json"
      - "package.json"
      - "index.js"
      - "gemini-extension.json"
      - ".claude-plugin/**"
      - ".agents/**"
      - ".codex-plugin/**"
      - ".cursor-plugin/**"
      - ".kimi-plugin/**"
      - "validate-skills.sh"
      - ".github/workflows/validate-skills.yml"
      - ".github/workflows/publish-npm.yml"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "evals/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"
      - "plugin.json"
      - "package.json"
      - "index.js"
      - "gemini-extension.json"
      - ".claude-plugin/**"
      - ".agents/**"
      - ".codex-plugin/**"
      - ".cursor-plugin/**"
      - ".kimi-plugin/**"
      - "validate-skills.sh"
      - ".github/workflows/validate-skills.yml"
      - ".github/workflows/publish-npm.yml"
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate skills and repository
        run: bash validate-skills.sh
